name: Finsler worker regression

on:
  push:
    branches: [finsler-calculator-experiment]
    paths:
      - 'finsler-worker-v3.js'
      - 'finsler-worker-v4-base.js'
      - 'finsler-worker-v4-stable.js'
      - 'finsler-worker-v4-canonical.js'
      - 'finsler-worker-v4-fast.js'
      - 'finsler-worker-v4-square.js'
      - 'finsler-worker-v4-core.js'
      - 'finsler-worker-v4.js'
      - 'finsler-ui-v6.js'
      - 'tests/finsler-worker-v3-baseline.cjs'
      - 'tests/finsler-worker-regression.cjs'
      - 'tests/finsler-christoffel-regression.cjs'
      - 'tests/finsler-spray-simplification.cjs'
      - 'tests/finsler-ricci-consistency.cjs'
      - 'tests/finsler-cross-invariants.cjs'
      - 'tests/finsler-general-invariants.cjs'
      - 'tests/finsler-ui-parentheses-regression.cjs'
      - '.github/workflows/finsler-worker-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finsler-worker-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schwarzschild-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: finsler-calculator-experiment
          fetch-depth: 0
      - name: Apply requested notation polish
        if: github.event.head_commit.message == 'Apply prettier notation via CI'
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_path = Path('finsler-ui-v6.js')
          ui = ui_path.read_text()
          old = '''  function tex(expr){try{return math.parse(String(expr)).toTex({parenthesis:"auto"});}catch(e){return "\\\\text{"+esc(expr).replace(/[{}]/g,"")+"}";}}'''
          new = r'''  function prettyResultTex(text){
            var s=String(text);
            s=s.replace(/\\mathrm\{rs\}/g,"r_{s}").replace(/\\operatorname\{rs\}/g,"r_{s}");
            s=s.replace(/(^|[^A-Za-z])rs(?=$|[^A-Za-z])/g,function(all,prefix){return prefix+"r_{s}";});
            var fn="\\\\(?:sin|cos|tan|sinh|cosh|tanh)";
            var arg="(?:\\\\[A-Za-z]+|[A-Za-z](?:_\\{[A-Za-z0-9]+\\})?)";
            s=s.replace(new RegExp("\\{("+fn+")\\\\left\\\\(\\s*("+arg+")\\s*\\\\right\\\\)\\}\\s*\\^\\s*\\{([^{}]+)\\}","g"),"$1^{$3} $2");
            s=s.replace(new RegExp("("+fn+")\\s*\\^\\s*\\{([^{}]+)\\}\\s*\\\\left\\\\(\\s*("+arg+")\\s*\\\\right\\\\)","g"),"$1^{$2} $3");
            s=s.replace(new RegExp("("+fn+")\\\\left\\\\(\\s*("+arg+")\\s*\\\\right\\\\)\\s*\\^\\s*\\{([^{}]+)\\}","g"),"$1^{$3} $2");
            s=s.replace(new RegExp("("+fn+")\\\\left\\\\(\\s*("+arg+")\\s*\\\\right\\\\)","g"),"$1 $2");
            return s;
          }
          function tex(expr){try{return prettyResultTex(math.parse(String(expr)).toTex({parenthesis:"auto"}));}catch(e){return "\\\\text{"+esc(expr).replace(/[{}]/g,"")+"}";}}'''
          if ui.count(old) != 1:
              raise SystemExit(f'Expected one tex() target, found {ui.count(old)}')
          ui_path.write_text(ui.replace(old, new))

          html_path = Path('Finsler.html')
          html = html_path.read_text()
          if html.count('finsler-ui-v6.js?v=3') != 1:
              raise SystemExit('Expected one v3 UI cache key')
          html_path.write_text(html.replace('finsler-ui-v6.js?v=3', 'finsler-ui-v6.js?v=4'))

          test_path = Path('tests/finsler-ui-parentheses-regression.cjs')
          test_path.write_text(r'''const fs = require('fs');
const path = require('path');
const math = require('mathjs');

const root = path.resolve(__dirname, '..');
const ui = fs.readFileSync(path.join(root, 'finsler-ui-v6.js'), 'utf8');
function fail(message) { console.error('FAIL:', message); process.exitCode = 1; }
if (!/toTex\(\{parenthesis:"auto"\}\)/.test(ui)) fail('UI tex() is not using automatic parenthesis serialization');
if (!/function prettyResultTex\(text\)/.test(ui)) fail('prettyResultTex() is missing');

function prettyResultTex(text) {
  var s = String(text);
  s = s.replace(/\\mathrm\{rs\}/g, 'r_{s}').replace(/\\operatorname\{rs\}/g, 'r_{s}');
  s = s.replace(/(^|[^A-Za-z])rs(?=$|[^A-Za-z])/g, (_, prefix) => prefix + 'r_{s}');
  var fn = '\\\\(?:sin|cos|tan|sinh|cosh|tanh)';
  var arg = '(?:\\\\[A-Za-z]+|[A-Za-z](?:_\\{[A-Za-z0-9]+\\})?)';
  s = s.replace(new RegExp('\\{(' + fn + ')\\\\left\\\\(\\s*(' + arg + ')\\s*\\\\right\\\\)\\}\\s*\\^\\s*\\{([^{}]+)\\}', 'g'), '$1^{$3} $2');
  s = s.replace(new RegExp('(' + fn + ')\\s*\\^\\s*\\{([^{}]+)\\}\\s*\\\\left\\\\(\\s*(' + arg + ')\\s*\\\\right\\\\)', 'g'), '$1^{$2} $3');
  s = s.replace(new RegExp('(' + fn + ')\\\\left\\\\(\\s*(' + arg + ')\\s*\\\\right\\\\)\\s*\\^\\s*\\{([^{}]+)\\}', 'g'), '$1^{$3} $2');
  s = s.replace(new RegExp('(' + fn + ')\\\\left\\\\(\\s*(' + arg + ')\\s*\\\\right\\\\)', 'g'), '$1 $2');
  return s;
}

const cases = [
  ['sin(theta)', /\\sin\s+\\theta/, /\\sin\\left\(/],
  ['cos(theta)', /\\cos\s+\\theta/, /\\cos\\left\(/],
  ['sin(theta)^2', /\\sin\^\{2\}\s+\\theta/, /\\sin\\left\(/],
  ['cos(theta)^3', /\\cos\^\{3\}\s+\\theta/, /\\cos\\left\(/],
  ['sin(theta+phi)^2', /\\sin/, null],
  ['rs/r', /r_\{s\}/, /(^|[^A-Za-z])rs(?=$|[^A-Za-z])/]
];
for (const [expr, required, forbidden] of cases) {
  const rendered = prettyResultTex(math.parse(expr).toTex({ parenthesis: 'auto' }));
  console.log(`${expr} => ${rendered}`);
  if (required && !required.test(rendered)) fail(`missing preferred notation for ${expr}: ${rendered}`);
  if (forbidden && forbidden.test(rendered)) fail(`unwanted notation remains for ${expr}: ${rendered}`);
  if (expr === 'sin(theta+phi)^2' && !/\\left\(/.test(rendered)) fail(`composite trig argument lost necessary parentheses: ${rendered}`);
}
if (!process.exitCode) console.log('PASS: compact trig notation, trig powers, minimal grouping, and r_s display');
''')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add finsler-ui-v6.js Finsler.html tests/finsler-ui-parentheses-regression.cjs
          git commit -m 'Polish trigonometric result notation'
          git push origin HEAD:finsler-calculator-experiment
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install exact browser symbolic engines
        run: npm install --no-save --ignore-scripts mathjs@11.11.2 nerdamer-prime@1.5.0
      - name: Verify UI parenthesis cleanup
        run: node tests/finsler-ui-parentheses-regression.cjs
      - name: Verify original geometry engine
        run: node tests/finsler-worker-v3-baseline.cjs
      - name: Verify canonical Schwarzschild Christoffels
        run: node tests/finsler-christoffel-regression.cjs
      - name: Verify canonical Schwarzschild spray
        run: node tests/finsler-spray-simplification.cjs
      - name: Verify rebuilt worker
        run: node tests/finsler-worker-regression.cjs
      - name: Verify affine/Finsler Ricci consistency
        run: node tests/finsler-ricci-consistency.cjs
      - name: Audit cross-geometry invariants
        run: node tests/finsler-cross-invariants.cjs
      - name: Audit genuine Finsler invariants
        run: node tests/finsler-general-invariants.cjs
