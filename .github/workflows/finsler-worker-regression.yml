name: Finsler worker regression

on:
  push:
    branches: [finsler-calculator-experiment]
    paths:
      - 'finsler-worker-v3.js'
      - 'finsler-worker-v4-base.js'
      - 'finsler-worker-v4-stable.js'
      - 'finsler-worker-v4-canonical.js'
      - 'finsler-worker-v4-fast.js'
      - 'finsler-worker-v4-square.js'
      - 'finsler-worker-v4-core.js'
      - 'finsler-worker-v4.js'
      - 'finsler-ui-v6.js'
      - 'finsler-metric-catalogue.js'
      - 'Finsler.html'
      - 'tests/finsler-worker-v3-baseline.cjs'
      - 'tests/finsler-worker-regression.cjs'
      - 'tests/finsler-christoffel-regression.cjs'
      - 'tests/finsler-spray-simplification.cjs'
      - 'tests/finsler-ricci-consistency.cjs'
      - 'tests/finsler-cross-invariants.cjs'
      - 'tests/finsler-general-invariants.cjs'
      - 'tests/finsler-ui-parentheses-regression.cjs'
      - '.github/workflows/finsler-worker-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finsler-worker-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schwarzschild-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: finsler-calculator-experiment
          fetch-depth: 0
      - name: Apply symbol-preserving notation patch
        if: github.event.head_commit.message == 'Retry symbol-preserving notation patch'
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_path = Path('finsler-ui-v6.js')
          ui = ui_path.read_text()
          line1 = '  s=s.replace(/\\\\mathrm\\{rs\\}/g,"r_{s}").replace(/\\\\operatorname\\{rs\\}/g,"r_{s}");\n'
          line2 = '  s=s.replace(/(^|[^A-Za-z])rs(?=$|[^A-Za-z])/g,function(all,prefix){return prefix+"r_{s}";});\n'
          if line1 not in ui or line2 not in ui:
              raise SystemExit('Expected forced rs -> r_s formatter mapping not found')
          ui = ui.replace(line1, '', 1).replace(line2, '', 1)
          ui_path.write_text(ui)

          cat_path = Path('finsler-metric-catalogue.js')
          cat = cat_path.read_text()
          marker = 'id:"schwarzschild", group:"Catalogue · Black holes", title:"Schwarzschild", dim:4,'
          start = cat.index(marker)
          end = cat.index('\n    },', start)
          block = cat[start:end]
          old_block = block
          block = block.replace('-(1-rs/r)', '-(1-r_s/r)')
          block = block.replace('1/(1-rs/r)', '1/(1-r_s/r)')
          block = block.replace('Standard Schwarzschild coordinates; rs is the Schwarzschild radius.', 'Standard Schwarzschild coordinates; r_s is the Schwarzschild radius.')
          if block == old_block:
              raise SystemExit('Schwarzschild preset did not change')
          cat_path.write_text(cat[:start] + block + cat[end:])

          html_path = Path('Finsler.html')
          html = html_path.read_text()
          old_detect = 'return a.indexOf("rs")!==-1&&a.indexOf("r")!==-1&&b.indexOf("rs")!==-1&&b.indexOf("r")!==-1;'
          new_detect = 'return a.indexOf("r_s")!==-1&&a.indexOf("r")!==-1&&b.indexOf("r_s")!==-1&&b.indexOf("r")!==-1;'
          if old_detect not in html:
              raise SystemExit('Expected Schwarzschild startup detector not found')
          html = html.replace(old_detect, new_detect, 1)
          html = html.replace('placeholder="M, rs, k, Lambda"', 'placeholder="M, r_s, k, Lambda"', 1)
          html = html.replace('finsler-metric-catalogue.js?v=4', 'finsler-metric-catalogue.js?v=5', 1)
          html = html.replace('finsler-ui-v6.js?v=4', 'finsler-ui-v6.js?v=5', 1)
          html_path.write_text(html)

          test_path = Path('tests/finsler-ui-parentheses-regression.cjs')
          test = test_path.read_text()
          old = "  const schwarzschild = render('rs/r');\n"
          new = "  const bareRs = render('rs/r');\n  const subscriptRs = render('r_s/r');\n"
          if old not in test:
              raise SystemExit('Expected old rs render case not found')
          test = test.replace(old, new, 1)
          test = test.replace("  console.log('rs/r =>', schwarzschild);\n", "  console.log('rs/r =>', bareRs);\n  console.log('r_s/r =>', subscriptRs);\n", 1)
          test = test.replace("  if (!/r_\\{s\\}/.test(schwarzschild)) fail(`Schwarzschild radius is not displayed as r_s: ${schwarzschild}`);\n", "  if (/r_\\{s\\}/.test(bareRs)) fail(`bare rs was rewritten as r_s: ${bareRs}`);\n", 1)
          test = test.replace("  if (/(^|[^A-Za-z])rs(?=$|[^A-Za-z])/.test(schwarzschild)) fail(`bare rs remains in displayed TeX: ${schwarzschild}`);\n", "  if (!/_/.test(subscriptRs)) fail(`entered r_s lost its subscript notation: ${subscriptRs}`);\n  if (bareRs === subscriptRs) fail(`rs and r_s rendered identically: ${bareRs}`);\n", 1)
          test = test.replace('PASS: compact trig notation, trig powers, minimal grouping, and r_s display', 'PASS: compact trig notation, minimal grouping, and symbol-preserving rs/r_s display', 1)
          test_path.write_text(test)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add finsler-ui-v6.js finsler-metric-catalogue.js Finsler.html tests/finsler-ui-parentheses-regression.cjs
          git commit -m 'Preserve user symbol notation'
          git push origin HEAD:finsler-calculator-experiment
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install exact browser symbolic engines
        run: npm install --no-save --ignore-scripts mathjs@11.11.2 nerdamer-prime@1.5.0
      - name: Verify UI parenthesis cleanup
        run: node tests/finsler-ui-parentheses-regression.cjs
      - name: Verify original geometry engine
        run: node tests/finsler-worker-v3-baseline.cjs
      - name: Verify canonical Schwarzschild Christoffels
        run: node tests/finsler-christoffel-regression.cjs
      - name: Verify canonical Schwarzschild spray
        run: node tests/finsler-spray-simplification.cjs
      - name: Verify rebuilt worker
        run: node tests/finsler-worker-regression.cjs
      - name: Verify affine/Finsler Ricci consistency
        run: node tests/finsler-ricci-consistency.cjs
      - name: Audit cross-geometry invariants
        run: node tests/finsler-cross-invariants.cjs
      - name: Audit genuine Finsler invariants
        run: node tests/finsler-general-invariants.cjs
