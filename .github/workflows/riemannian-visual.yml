name: Riemannian calculator visual audit

on:
  push:
    branches: [finsler-calculator-experiment]

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save puppeteer-core@24
      - run: |
          python3 -m http.server 8000 > /tmp/riemannian-http.log 2>&1 &
          sleep 1
      - name: Browser regression and screenshots
        run: |
          cat > visual.cjs <<'NODE'
          const puppeteer=require('puppeteer-core'),cp=require('child_process');
          const which=c=>{try{return cp.execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim()}catch{return ''}};
          const executablePath=which('google-chrome')||which('chromium')||which('chromium-browser');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const zero=v=>String(v).replace(/\s+/g,'')==='0';
          const nearly=(a,b)=>Number.isFinite(a)&&Math.abs(a-b)<1e-8;
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
            await page.setViewport({width:1440,height:1200,deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:8000/Finsler.html',{waitUntil:'networkidle2',timeout:60000});
            await page.evaluate(()=>localStorage.clear());
            await page.reload({waitUntil:'networkidle2'});
            async function calc(preset,keys,file){
              await page.select('#presetSelect',preset);await page.click('#loadPreset');
              await page.evaluate(keys=>{for(const e of document.querySelectorAll('[data-output]'))e.checked=false;for(const k of keys){const e=document.querySelector(`[data-output="${k}"]`);if(e)e.checked=true;}},keys);
              await page.click('#calculateSelected');
              await page.waitForFunction(()=>document.querySelector('#status')?.classList.contains('is-success')||document.querySelector('#status')?.classList.contains('is-error'),{timeout:30000});
              const status=await page.$eval('#status',e=>({text:e.textContent,cls:e.className}));
              if(!status.cls.includes('is-success'))throw new Error(preset+': '+status.text);
              await page.waitForFunction(()=>window.__riemannianLastResult!==null,{timeout:3000});
              await sleep(400);
              if(file){await page.$$eval('#results details',ds=>ds.forEach(d=>d.open=true));await sleep(250);await page.screenshot({path:file,fullPage:true});}
              return page.evaluate(()=>window.__riemannianLastResult);
            }
            const allZero=m=>m.every(row=>row.every(zero));
            const ev=(expr,scope)=>page.evaluate(({expr,scope})=>math.evaluate(expr,scope),{expr,scope});

            const s=await calc('schwarzschild',['inverse','christoffel','ricci','scalar','einstein'],'schwarzschild.png');
            if(!allZero(s.ricci)||!zero(s.scalar)||!allZero(s.einstein))throw new Error('Schwarzschild curvature regression');

            const f=await calc('flrw-flat',['ricci','scalar','einstein'],'flrw.png');
            const fs={__uf0:2,__uf0_d1:3,__uf0_d1_1:5,x1:0,x2:.7,x3:.8,x4:.2};
            if(!nearly(await ev(f.ricci[0][0],fs),-7.5)||!nearly(await ev(f.scalar,fs),28.5)||!nearly(await ev(f.einstein[0][0],fs),6.75))throw new Error('flat FLRW regression '+JSON.stringify(f));

            const kf=await calc('flrw-curved',['ricci','scalar','einstein']);
            const ks={__uf0:2,__uf0_d1:3,__uf0_d1_1:5,x1:0,x2:.7,x3:.8,x4:.2,k:.1};
            const den=1-ks.k*ks.x2*ks.x2, B=2*ks.k+ks.__uf0*ks.__uf0_d1_1+2*ks.__uf0_d1*ks.__uf0_d1;
            if(!nearly(await ev(kf.ricci[0][0],ks),-3*ks.__uf0_d1_1/ks.__uf0)||
               !nearly(await ev(kf.ricci[1][1],ks),B/den)||
               !nearly(await ev(kf.scalar,ks),6*(ks.k+ks.__uf0*ks.__uf0_d1_1+ks.__uf0_d1*ks.__uf0_d1)/(ks.__uf0*ks.__uf0))||
               !nearly(await ev(kf.einstein[0][0],ks),3*(ks.k+ks.__uf0_d1*ks.__uf0_d1)/(ks.__uf0*ks.__uf0)))throw new Error('curved FLRW regression '+JSON.stringify(kf));

            const pp=await calc('ppwave',['ricci','scalar','einstein'],'ppwave.png');
            const ps={__uf0:7,__uf0_d2_2:4,__uf0_d3_3:6,x1:.2,x2:.1,x3:.3,x4:.4};
            if(!zero(pp.scalar)||!nearly(await ev(pp.ricci[0][0],ps),-5)||!nearly(await ev(pp.einstein[0][0],ps),-5))throw new Error('pp-wave regression '+JSON.stringify(pp));

            const mjx=await page.$$eval('mjx-merror',es=>es.map(e=>e.textContent));
            if(mjx.length||errors.length)throw new Error('Browser errors '+JSON.stringify({mjx,errors}));
            console.log('EXTENDED_GEOMETRY_PASS');
            console.log('FLRW_SCALAR '+f.scalar);
            console.log('CURVED_FLRW_SCALAR '+kf.scalar);
            console.log('PP_RICCI_UU '+pp.ricci[0][0]);
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node visual.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: riemannian-visual-audit
          path: |
            schwarzschild.png
            flrw.png
            ppwave.png
