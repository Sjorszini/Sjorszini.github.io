name: Apply banner mobile navigation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-banner-mobile-nav.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply shared mobile banner navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = {
              "publications.html": "Publications",
              "teaching.html": "Teaching",
              "pianist.html": "Pianist",
              "Balls.html": "Balls",
              "contact.html": "Contact",
          }
          links = [
              ("index.html", "Home"),
              ("publications.html", "Publications"),
              ("teaching.html", "Teaching"),
              ("pianist.html", "Pianist"),
              ("Balls.html", "Balls"),
              ("contact.html", "Contact"),
          ]

          def nav(current):
              items = []
              for href, label in links:
                  cls = ' class="current"' if label == current else ''
                  items.append(f'        <a{cls} href="{href}">{label}</a>')
              return '''    <nav class="banner-mobile-nav" aria-label="Mobile navigation">\n      <button class="banner-menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="banner-mobile-menu" onclick="var n=this.parentElement;var o=n.classList.toggle('is-open');this.setAttribute('aria-expanded',o?'true':'false');this.setAttribute('aria-label',o?'Close navigation menu':'Open navigation menu');"><span class="banner-menu-icon" aria-hidden="true"></span></button>\n      <div class="banner-menu-list" id="banner-mobile-menu">\n''' + "\n".join(items) + '''\n      </div>\n    </nav>'''

          for filename, current in files.items():
              path = Path(filename)
              text = path.read_text()
              text = text.replace('menu-clean.css?v=3', 'menu-clean.css?v=4')
              if 'class="banner-mobile-nav"' not in text:
                  marker = '    <h1>Sjors Heefer</h1>'
                  if marker not in text:
                      raise RuntimeError(f"Header marker not found in {filename}")
                  text = text.replace(marker, marker + "\n" + nav(current), 1)
              path.write_text(text)

          index = Path('index.html')
          text = index.read_text().replace('menu-clean.css?v=3', 'menu-clean.css?v=4')
          index.write_text(text)

          css_path = Path('menu-clean.css')
          css = css_path.read_text()
          if '.banner-mobile-nav {' not in css:
              css += r'''

/* Mobile navigation embedded in the page banner. */
.banner-mobile-nav {
  display: none;
}

@media (max-width: 560px) {
  body:has(.banner-mobile-nav) menubar {
    display: none;
  }

  body:has(.banner-mobile-nav) .container {
    margin-top: 0;
  }

  body:has(.banner-mobile-nav) header {
    overflow: visible;
  }

  .banner-mobile-nav {
    position: absolute;
    z-index: 20;
    top: 50%;
    right: 18px;
    display: block;
    transform: translateY(-50%);
  }

  .banner-menu-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    padding: 0;
    color: rgba(255, 255, 255, 0.94);
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.17);
    border-radius: 11px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .banner-menu-toggle:hover,
  .banner-menu-toggle:focus-visible {
    color: #fff;
    background: rgba(255, 255, 255, 0.12);
  }

  .banner-menu-icon::before {
    content: "☰";
    font-size: 1.35rem;
    line-height: 1;
  }

  .banner-mobile-nav.is-open .banner-menu-icon::before {
    content: "×";
    font-size: 1.62rem;
  }

  .banner-menu-list {
    position: absolute;
    top: 56px;
    right: 0;
    display: none;
    width: min(230px, calc(100vw - 36px));
    padding: 7px;
    background: rgba(3, 11, 20, 0.985);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 12px;
    box-shadow: 0 16px 36px rgba(4, 14, 28, 0.30);
  }

  .banner-mobile-nav.is-open .banner-menu-list {
    display: grid;
  }

  .banner-menu-list a {
    display: block;
    padding: 10px 12px;
    color: rgba(255, 255, 255, 0.78);
    border-radius: 7px;
    font-size: 0.88rem;
    font-weight: 600;
    line-height: 1.35;
    text-decoration: none;
  }

  .banner-menu-list a:hover,
  .banner-menu-list a:focus-visible {
    color: #fff;
    background: rgba(255, 255, 255, 0.07);
  }

  .banner-menu-list a.current {
    color: #fff;
    background: rgba(120, 170, 224, 0.13);
  }

  .banner-menu-list a.current::after {
    content: "";
    display: block;
    width: 28px;
    height: 2px;
    margin-top: 5px;
    border-radius: 2px;
    background: #78aae0;
  }
}
'''
          css_path.write_text(css)
          PY

      - name: Remove temporary workflow and commit navigation patch
        run: |
          rm .github/workflows/apply-banner-mobile-nav.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html publications.html teaching.html pianist.html Balls.html contact.html menu-clean.css .github/workflows/apply-banner-mobile-nav.yml
          git commit -m "Use banner mobile navigation across main pages"
          git push origin HEAD:main
