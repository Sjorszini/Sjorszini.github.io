name: Riemannian calculator regression

on:
  workflow_dispatch:
  push:
    branches: [finsler-calculator-experiment]
    paths:
      - '*.html'
      - riemannian-calculator.css
      - riemannian-live-preview.css
      - riemannian-calculator.js
      - riemannian-live-preview.js
      - riemannian-extra-presets.js
      - riemannian-pretty.js
      - 'riemannian-worker*.js'
      - tests/riemannian-browser-regression.cjs
      - tests/riemannian-preview-regression.cjs
      - tests/riemannian-extra-presets-regression.cjs
      - .github/workflows/riemannian-regression.yml

permissions:
  contents: write

concurrency:
  group: riemannian-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finsler-calculator-experiment
      - name: Apply connection fast path and menu repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          calc=Path('riemannian-calculator.js')
          text=calc.read_text()
          text=text.replace('riemannian-worker.js?v=4','riemannian-worker-connection-fast.js?v=1')
          calc.write_text(text)

          html=Path('Finsler.html')
          text=html.read_text().replace('riemannian-calculator.js?v=5','riemannian-calculator.js?v=6')
          html.write_text(text)

          changed=[]
          for path in Path('.').glob('*.html'):
              text=path.read_text()
              start=text.find('<menu id="site-menu">')
              if start < 0:
                  continue
              end=text.find('</menu>', start)
              if end < 0:
                  continue
              block=text[start:end]
              if 'href="Finsler.html"' not in block:
                  calc_item='    <menu-item><a href="Finsler.html">Calc</a></menu-item>\n'
                  contact=re.search(r'(?m)^(\s*<menu-item(?: class="currentpage")?><a href="contact\.html">Contact</a></menu-item>)', block)
                  if contact:
                      block=block[:contact.start()]+calc_item+block[contact.start():]
                  else:
                      block=block.rstrip()+"\n"+calc_item
                  text=text[:start]+block+text[end:]
                  path.write_text(text)
                  changed.append(path.name)

          test=Path('tests/riemannian-extra-presets-regression.cjs')
          text=test.read_text()
          if 'KERR_CONNECTION_MS' not in text:
              anchor="  assert(kerrIdentityError < 1e-8, `Kerr inverse failed numerical identity check: ${kerrIdentityError}`);\n"
              insert=r'''

  // Kerr connection must use sparse inverse support and lower-index symmetry.
  await page.evaluate(() => {
    document.querySelectorAll('[data-output]').forEach(n => { n.checked = false; });
    const gamma = document.querySelector('[data-output="christoffel"]');
    gamma.checked = true; gamma.dispatchEvent(new Event('change', {bubbles: true}));
    window.__riemannianLastResult = null;
  });
  const kerrConnectionStarted = Date.now();
  await page.click('#calculateSelected');
  await page.waitForFunction(() => document.querySelector('#status')?.classList.contains('is-success'), {timeout: 20000});
  const kerrConnectionMs = Date.now() - kerrConnectionStarted;
  const kerrGamma = await page.evaluate(() => {
    const parts = window.__riemannianLastResult?.christoffel || [];
    const scope = {M:1, a:0, x1:0, x2:5, x3:1.1, x4:0};
    function value(i,j,k) {
      const part=parts.find(c => c.i===i && c.j===j && c.k===k);
      return part ? math.evaluate(part.value, scope) : 0;
    }
    return {
      ttr:value(0,0,1),
      rtt:value(1,0,0),
      rrr:value(1,1,1),
      rthth:value(1,2,2)
    };
  });
  console.log(`KERR_CONNECTION_MS ${kerrConnectionMs}`);
  assert(kerrConnectionMs < 12000, `Kerr Levi-Civita connection took too long: ${kerrConnectionMs} ms`);
  assert(Math.abs(kerrGamma.ttr-1/15) < 1e-7, `Kerr a=0 Gamma^t_tr mismatch: ${kerrGamma.ttr}`);
  assert(Math.abs(kerrGamma.rtt-3/125) < 1e-7, `Kerr a=0 Gamma^r_tt mismatch: ${kerrGamma.rtt}`);
  assert(Math.abs(kerrGamma.rrr+1/15) < 1e-7, `Kerr a=0 Gamma^r_rr mismatch: ${kerrGamma.rrr}`);
  assert(Math.abs(kerrGamma.rthth+3) < 1e-7, `Kerr a=0 Gamma^r_thth mismatch: ${kerrGamma.rthth}`);
'''
              if anchor not in text:
                  raise SystemExit('Kerr inverse anchor not found')
              text=text.replace(anchor,anchor+insert)
          if 'MENU_CALC_LINKS_PASS' not in text:
              anchor="  const mathErrors = await page.$$eval('mjx-merror', nodes => nodes.map(n => n.textContent));\n"
              insert=r'''
  for (const navPath of ['index.html','publications.html','teaching.html','pianist.html','Balls.html','Finsler.html','contact.html']) {
    const navPage=await browser.newPage();
    await navPage.goto(`http://127.0.0.1:8000/${navPath}`, {waitUntil:'domcontentloaded', timeout:30000});
    const count=await navPage.$$eval('#site-menu a[href="Finsler.html"]', nodes => nodes.length);
    assert(count===1, `${navPath}: expected exactly one Calc menu link, got ${count}`);
    await navPage.close();
  }
  console.log('MENU_CALC_LINKS_PASS');

'''
              if anchor not in text:
                  raise SystemExit('menu-test anchor not found')
              text=text.replace(anchor,insert+anchor)
          test.write_text(text)

          # Static audit: every root page that uses the site menu must expose Calc exactly once.
          for path in Path('.').glob('*.html'):
              text=path.read_text()
              start=text.find('<menu id="site-menu">')
              if start < 0:
                  continue
              end=text.find('</menu>', start)
              block=text[start:end]
              if block.count('href="Finsler.html"') != 1:
                  raise SystemExit(f'{path}: Calc menu count is not one')
          print('MENU_STATIC_AUDIT_PASS', ','.join(changed) if changed else 'no changes needed')
          PY
          node --check riemannian-worker-connection-fast.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        run: npm install --no-save puppeteer-core@24
      - name: Serve calculator
        run: |
          python3 -m http.server 8000 > /tmp/riemannian-http.log 2>&1 &
          sleep 1
      - name: Run real-Chrome geometry regression
        run: node tests/riemannian-browser-regression.cjs
      - name: Run live-preview and notation regression
        run: node tests/riemannian-preview-regression.cjs
      - name: Run representative-preset, Kerr, and menu regression
        run: node tests/riemannian-extra-presets-regression.cjs
      - name: Commit verified fixes
        if: success()
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add '*.html' riemannian-calculator.js tests/riemannian-extra-presets-regression.cjs
            git commit -m 'Speed up Kerr connection and synchronize Calc menus'
            git push origin HEAD:finsler-calculator-experiment
          fi
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: riemannian-regression-failure
          path: riemannian-regression-failure.png
          if-no-files-found: ignore
