name: One-time Riemannian worker consolidation

on:
  push:
    branches: [finsler-calculator-experiment]
    paths:
      - .github/workflows/riemannian-worker-consolidate.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finsler-calculator-experiment
      - name: Collapse worker layers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          base = Path('riemannian-worker.js').read_text()
          fast = Path('riemannian-worker-fast.js').read_text()
          present = Path('riemannian-worker-present.js').read_text()

          def body(text, imported):
              text = re.sub(r'^\s*"use strict";\s*', '', text, count=1)
              text = re.sub(r'^\s*/\*.*?\*/\s*', '', text, count=1, flags=re.S)
              text = text.replace(imported, '', 1).lstrip()
              return text.rstrip()

          merged = (
              base.rstrip()
              + '\n\n/* Exact rational curvature canonicalization. */\n'
              + body(fast, 'importScripts("riemannian-worker.js?v=2");')
              + '\n\n/* Final exact factor and display canonicalization. */\n'
              + body(present, 'importScripts("riemannian-worker-fast.js?v=4");')
              + '\n'
          )
          Path('riemannian-worker.js').write_text(merged)
          PY
          rm riemannian-worker-fast.js riemannian-worker-present.js
          sed -i 's/riemannian-worker-present\.js?v=4/riemannian-worker.js?v=3/' riemannian-calculator.js
          sed -i 's/riemannian-calculator\.js?v=3/riemannian-calculator.js?v=4/' Finsler.html
          node --check riemannian-worker.js
          node --check riemannian-calculator.js
      - name: Commit consolidated worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Finsler.html riemannian-calculator.js riemannian-worker.js riemannian-worker-fast.js riemannian-worker-present.js
          git commit -m "Collapse Riemannian worker into one file"
          git push origin HEAD:finsler-calculator-experiment
