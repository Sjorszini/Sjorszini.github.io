name: Optimize test images

on:
  push:
    branches:
      - design-refresh-experiments
    paths:
      - .github/workflows/optimize-test-images.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design-refresh-experiments

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create web-sized image copies
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          jobs = [
              (Path("Studio_Koudijs_Sjors_DEF2.jpg"), Path("Studio_Koudijs_Sjors_DEF2-web.jpg")),
              (Path("piano.jpg"), Path("piano-web.jpg")),
          ]

          for src, dst in jobs:
              with Image.open(src) as original:
                  info = original.info.copy()
                  im = ImageOps.exif_transpose(original)
                  if im.mode not in ("RGB", "L"):
                      im = im.convert("RGB")
                  original_size = im.size
                  im.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
                  save_args = dict(format="JPEG", quality=88, optimize=True, progressive=True)
                  if info.get("icc_profile"):
                      save_args["icc_profile"] = info["icc_profile"]
                  im.save(dst, **save_args)
                  print(f"{src}: {original_size} -> {im.size}; {dst.stat().st_size / 1024:.0f} KiB")
          PY

      - name: Commit optimized copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Studio_Koudijs_Sjors_DEF2-web.jpg piano-web.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Add optimized web image copies"
          git push origin HEAD:design-refresh-experiments
