name: Temporary metric preview visual audit

on:
  push:
    branches: [finsler-calculator-experiment]
    paths:
      - .github/workflows/riemannian-preview-visual-audit.yml

permissions:
  contents: read

jobs:
  # Final visual check after simplifying the preview label.
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save puppeteer-core@24
      - run: |
          python3 -m http.server 8000 > /tmp/geometry-http.log 2>&1 &
          sleep 1
      - name: Capture preview
        run: |
          cat > /tmp/preview-audit.cjs <<'NODE'
          const puppeteer=require(process.cwd()+'/node_modules/puppeteer-core');
          const cp=require('child_process');
          const exe=cp.execFileSync('bash',['-lc','command -v google-chrome || command -v chromium'],{encoding:'utf8'}).trim();
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:1100,deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:8000/Finsler.html',{waitUntil:'networkidle2',timeout:60000});
            await page.evaluate(()=>localStorage.clear());
            await page.reload({waitUntil:'networkidle2',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#metricPreview')?.dataset.tex,{timeout:10000});
            await page.select('#presetSelect','flrw-flat');
            await page.click('#loadPreset');
            await new Promise(r=>setTimeout(r,700));
            const card=await page.$('.metric-card');
            await card.screenshot({path:'metric-preview-audit.png'});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/preview-audit.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: metric-preview-visual-audit
          path: metric-preview-audit.png
