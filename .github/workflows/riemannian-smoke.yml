name: Riemannian calculator smoke

on:
  push:
    branches: [finsler-calculator-experiment]

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save puppeteer-core@24
      - run: |
          python3 -m http.server 8000 > /tmp/riemannian-http.log 2>&1 &
          sleep 1
      - name: Browser regression
        run: |
          cat > smoke.cjs <<'NODE'
          const puppeteer=require('puppeteer-core'),cp=require('child_process');
          const which=c=>{try{return cp.execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim()}catch{return ''}};
          const executablePath=which('google-chrome')||which('chromium')||which('chromium-browser');
          const zero=v=>String(v).replace(/\s+/g,'')==='0', nearly=(a,b)=>Number.isFinite(a)&&Math.abs(a-b)<1e-8, sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
            await page.goto('http://127.0.0.1:8000/Finsler.html',{waitUntil:'networkidle2',timeout:60000});
            async function calc(preset,keys){
              await page.select('#presetSelect',preset);await page.click('#loadPreset');
              await page.evaluate(keys=>{for(const e of document.querySelectorAll('[data-output]'))e.checked=false;for(const key of keys){const e=document.querySelector(`[data-output="${key}"]`);if(e)e.checked=true;}},keys);
              await page.click('#calculateSelected');
              await page.waitForFunction(()=>document.querySelector('#status')?.classList.contains('is-success')||document.querySelector('#status')?.classList.contains('is-error'),{timeout:30000});
              const status=await page.$eval('#status',e=>({text:e.textContent,cls:e.className}));if(!status.cls.includes('is-success'))throw new Error(preset+': '+status.text);
              await page.waitForFunction(()=>window.__riemannianLastResult!==null,{timeout:3000});await sleep(350);return page.evaluate(()=>window.__riemannianLastResult);
            }
            const allZero=m=>m.every(row=>row.every(zero)), ev=(expr,scope)=>page.evaluate(({expr,scope})=>math.evaluate(expr,scope),{expr,scope}), comp=(a,i,j,k)=>a.find(c=>c.i===i&&c.j===j&&c.k===k);
            const s=await calc('schwarzschild',['inverse','christoffel','ricci','scalar','einstein']);
            if(!allZero(s.ricci)||!zero(s.scalar)||!allZero(s.einstein))throw new Error('Schwarzschild curvature');
            const inv=s.inverse.matrix;
            if(/r_s\s*-\s*x2/.test(inv.flat().join('|')))throw new Error('Inverse still uses r_s-x2: '+JSON.stringify(inv));
            if(!/x2\s*-\s*r_s/.test(inv[0][0])||!/x2\s*-\s*r_s/.test(inv[1][1]))throw new Error('Inverse orientation missing: '+JSON.stringify(inv));
            const scope={x1:0,x2:5,x3:.8,x4:.4,r_s:2};
            if(!nearly(await ev(inv[0][0],scope),-5/3)||!nearly(await ev(inv[1][1],scope),3/5)||!nearly(await ev(inv[2][2],scope),1/25))throw new Error('Inverse numeric mismatch '+JSON.stringify(inv));
            const vals=s.christoffel.map(c=>c.value);if(vals.some(v=>/r_s\s*-\s*x2/.test(v)||/\(1\s*\/\s*2\)/.test(v)))throw new Error('Connection formatting regression '+vals.join('|'));
            if(!nearly(await ev(comp(s.christoffel,0,0,1).value,scope),1/15)||!nearly(await ev(comp(s.christoffel,1,0,0).value,scope),3/125)||!nearly(await ev(comp(s.christoffel,1,1,1).value,scope),-1/15))throw new Error('Connection numeric regression');
            const f=await calc('flrw-flat',['ricci','scalar','einstein']),fs={__uf0:2,__uf0_d1:3,__uf0_d1_1:5,x1:11,x2:7,x3:.8,x4:.4};
            if(!nearly(await ev(f.ricci[0][0],fs),-7.5)||!nearly(await ev(f.scalar,fs),28.5)||!nearly(await ev(f.einstein[0][0],fs),6.75))throw new Error('FLRW regression');
            const m=await calc('minkowski',['christoffel','ricci','scalar','einstein']);if(m.christoffel.length||!allZero(m.ricci)||!zero(m.scalar)||!allZero(m.einstein))throw new Error('Minkowski regression');
            const p=await calc('polar2',['christoffel','ricci','scalar']);if(!allZero(p.ricci)||!zero(p.scalar)||!nearly(await ev(comp(p.christoffel,0,1,1).value,{x1:3,x2:.4}),-3))throw new Error('Polar regression');
            const q=await calc('sphere2',['ricci','scalar','einstein']),qs={R:3,x1:.7,x2:.2};if(!nearly(await ev(q.scalar,qs),2/9)||!allZero(q.einstein))throw new Error('Sphere regression');
            const mjx=await page.$$eval('mjx-merror',es=>es.length);if(mjx||errors.length)throw new Error('Browser errors '+JSON.stringify(errors));
            console.log('SCHWARZSCHILD_INVERSE '+JSON.stringify(s.inverse));console.log('PASS');await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node smoke.cjs
