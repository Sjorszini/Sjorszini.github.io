name: Riemannian calculator smoke

on:
  push:
    branches: [finsler-calculator-experiment]

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save puppeteer-core@24
      - run: |
          python3 -m http.server 8000 > /tmp/riemannian-http.log 2>&1 &
          sleep 1
      - name: Browser regression
        run: |
          cat > smoke.cjs <<'NODE'
          const puppeteer=require('puppeteer-core'),cp=require('child_process');
          const which=c=>{try{return cp.execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim()}catch{return ''}};
          const executablePath=which('google-chrome')||which('chromium')||which('chromium-browser');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
            await page.goto('http://127.0.0.1:8000/Finsler.html',{waitUntil:'networkidle2',timeout:60000});
            const patched=await page.evaluate(()=>!!window.Worker.__riemannianPrettyPatched);if(patched)throw new Error('Worker is still monkey-patched');
            await page.select('#presetSelect','flrw-flat');await page.click('#loadPreset');
            const tex=await page.evaluate(()=>({a1:math.parse('a_t').toTex(),a2:math.parse('a_tt').toTex(),rs:math.parse('r_s').toTex(),prod:math.parse('r*r_s').toTex()}));
            if(!/\\dot\{a\}/.test(tex.a1)||!/\\ddot\{a\}/.test(tex.a2)||!/r_\{s\}/.test(tex.rs)||/\\cdotr/.test(tex.prod))throw new Error('notation regression '+JSON.stringify(tex));
            async function calc(preset,keys){
              await page.select('#presetSelect',preset);await page.click('#loadPreset');
              await page.evaluate(keys=>{for(const e of document.querySelectorAll('[data-output]'))e.checked=false;for(const k of keys){const e=document.querySelector(`[data-output="${k}"]`);if(e)e.checked=true;}},keys);
              await page.click('#calculateSelected');
              await page.waitForFunction(()=>document.querySelector('#status')?.classList.contains('is-success')||document.querySelector('#status')?.classList.contains('is-error'),{timeout:30000});
              const status=await page.$eval('#status',e=>({text:e.textContent,cls:e.className}));if(!status.cls.includes('is-success'))throw new Error(preset+': '+status.text);
              await sleep(300);return page.evaluate(()=>window.__riemannianLastResult);
            }
            const zero=v=>String(v).replace(/\s+/g,'')==='0',allZero=m=>m.every(r=>r.every(zero));
            const s=await calc('schwarzschild',['ricci','scalar','einstein']);if(!allZero(s.ricci)||!zero(s.scalar)||!allZero(s.einstein))throw new Error('Schwarzschild regression');
            const f=await calc('flrw-flat',['ricci','scalar','einstein']);if(!f.ricci||!f.einstein)throw new Error('FLRW result missing');
            const mjx=await page.$$eval('mjx-merror',es=>es.map(e=>e.textContent));if(mjx.length||errors.length)throw new Error('browser errors '+JSON.stringify({mjx,errors}));
            console.log('NOTATION_HELPER_PASS '+JSON.stringify(tex));await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node smoke.cjs
