name: Riemannian calculator smoke

on:
  push:
    branches: [finsler-calculator-experiment]

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        run: npm install --no-save puppeteer-core@24
      - name: Run local server
        run: |
          python3 -m http.server 8000 > /tmp/riemannian-http.log 2>&1 &
          sleep 1
      - name: Run calculator regressions in Chrome
        run: |
          cat > smoke.cjs <<'NODE'
          const puppeteer=require('puppeteer-core');
          const cp=require('child_process');
          function which(c){try{return cp.execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim()}catch{return ''}}
          const executablePath=which('google-chrome')||which('chromium')||which('chromium-browser');
          if(!executablePath)throw new Error('Chrome/Chromium not found');
          const zero=v=>String(v).replace(/\s+/g,'')==='0';
          const nearly=(a,b)=>Number.isFinite(a)&&Math.abs(a-b)<1e-8;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text());});
            await page.goto('http://127.0.0.1:8000/Finsler.html',{waitUntil:'networkidle2',timeout:60000});

            async function calculate(preset,keys){
              await page.select('#presetSelect',preset);await page.click('#loadPreset');
              await page.evaluate(keys=>{
                for(const e of document.querySelectorAll('[data-output]'))e.checked=false;
                for(const key of keys){const e=document.querySelector(`[data-output="${key}"]`);if(e)e.checked=true;}
              },keys);
              await page.click('#calculateSelected');
              await page.waitForFunction(()=>document.querySelector('#status')?.classList.contains('is-success')||document.querySelector('#status')?.classList.contains('is-error'),{timeout:30000});
              const status=await page.$eval('#status',e=>({text:e.textContent,cls:e.className}));
              if(!/\bis-success\b/.test(status.cls))throw new Error(preset+' failed: '+status.text);
              await page.waitForFunction(()=>window.__riemannianLastResult!==null,{timeout:3000});
              await sleep(400);
              return page.evaluate(()=>window.__riemannianLastResult);
            }
            const allZero=m=>Array.isArray(m)&&m.every(row=>row.every(zero));
            const evalExpr=(expr,scope)=>page.evaluate(({expr,scope})=>math.evaluate(expr,scope),{expr,scope});
            const component=(list,i,j,k)=>(list||[]).find(c=>c.i===i&&c.j===j&&c.k===k);

            const s=await calculate('schwarzschild',['inverse','christoffel','ricci','scalar','einstein']);
            if(!allZero(s.ricci)||!zero(s.scalar)||!allZero(s.einstein))throw new Error('Schwarzschild vacuum curvature regression');
            const values=s.christoffel.map(c=>c.value);
            if(values.some(v=>/r_s\s*-\s*x2/.test(v)))throw new Error('Old r_s-x2 orientation remains: '+values.join(' | '));
            if(values.some(v=>/\(1\s*\/\s*2\)/.test(v)))throw new Error('Nested 1/2 factor remains: '+values.join(' | '));
            const gtr=component(s.christoffel,0,0,1),grtt=component(s.christoffel,1,0,0),grrr=component(s.christoffel,1,1,1),grthth=component(s.christoffel,1,2,2);
            if(!gtr||!grtt||!grrr||!grthth)throw new Error('Schwarzschild connection components missing');
            const scope={x1:0,x2:5,x3:.8,x4:.4,r_s:2};
            const sv={gtr:await evalExpr(gtr.value,scope),grtt:await evalExpr(grtt.value,scope),grrr:await evalExpr(grrr.value,scope),grthth:await evalExpr(grthth.value,scope)};
            if(!nearly(sv.gtr,1/15)||!nearly(sv.grtt,3/125)||!nearly(sv.grrr,-1/15)||!nearly(sv.grthth,-3))throw new Error('Schwarzschild numeric mismatch '+JSON.stringify(sv));

            const f=await calculate('flrw-flat',['ricci','scalar','einstein']);
            const fs={__uf0:2,__uf0_d1:3,__uf0_d1_1:5,x1:11,x2:7,x3:.8,x4:.4};
            if(!nearly(await evalExpr(f.ricci[0][0],fs),-7.5)||!nearly(await evalExpr(f.ricci[1][1],fs),28)||!nearly(await evalExpr(f.scalar,fs),28.5)||!nearly(await evalExpr(f.einstein[0][0],fs),6.75)||!nearly(await evalExpr(f.einstein[1][1],fs),-29))throw new Error('FLRW regression');

            const m=await calculate('minkowski',['christoffel','ricci','scalar','einstein']);
            if(m.christoffel.length||!allZero(m.ricci)||!zero(m.scalar)||!allZero(m.einstein))throw new Error('Minkowski regression');

            const p=await calculate('polar2',['christoffel','ricci','scalar']);
            if(!allZero(p.ricci)||!zero(p.scalar))throw new Error('Polar curvature regression');
            const pr=component(p.christoffel,0,1,1),pp=component(p.christoffel,1,0,1);
            if(!nearly(await evalExpr(pr.value,{x1:3,x2:.4}),-3)||!nearly(await evalExpr(pp.value,{x1:3,x2:.4}),1/3))throw new Error('Polar connection regression');

            const q=await calculate('sphere2',['ricci','scalar','einstein']);
            const qs={R:3,x1:.7,x2:.2};
            if(!nearly(await evalExpr(q.ricci[0][0],qs),1)||!nearly(await evalExpr(q.ricci[1][1],qs),Math.sin(.7)**2)||!nearly(await evalExpr(q.scalar,qs),2/9)||!allZero(q.einstein))throw new Error('Sphere regression');

            const mjxErrors=await page.$$eval('mjx-merror',els=>els.map(e=>e.textContent||'MathJax error'));
            if(mjxErrors.length)throw new Error('MathJax errors: '+mjxErrors.join(' | '));
            if(errors.length)throw new Error(errors.join(' | '));
            console.log('SCHWARZSCHILD_CONNECTION '+JSON.stringify(values));
            console.log('ALL_REGRESSIONS_PASS');
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node smoke.cjs
