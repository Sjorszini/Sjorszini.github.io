name: Riemannian calculator smoke
on:
  push:
    branches: [finsler-calculator-experiment]
  workflow_dispatch:

jobs:
  schwarzschild-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save puppeteer-core@24
      - name: Run local server
        run: |
          python3 -m http.server 8000 > /tmp/riemannian-http.log 2>&1 &
          sleep 1
      - name: Diagnose Schwarzschild calculator in Chrome
        run: |
          cat > diagnose.cjs <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          const cp=require('child_process');
          function which(c){try{return cp.execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim()}catch{return ''}}
          const executablePath=which('google-chrome')||which('chromium')||which('chromium-browser');
          if(!executablePath)throw new Error('Chrome/Chromium not found');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:1000});
            const events=[];
            page.on('pageerror',e=>{events.push('PAGEERROR '+e.message);console.log('PAGEERROR',e.message);});
            page.on('console',m=>{events.push('CONSOLE '+m.type()+' '+m.text());console.log('BROWSER',m.type(),m.text());});
            await page.goto('http://127.0.0.1:8000/Finsler.html',{waitUntil:'networkidle2',timeout:60000});
            await page.select('#presetSelect','schwarzschild');await page.click('#loadPreset');
            await page.evaluate(()=>{
              for(const e of document.querySelectorAll('[data-output]'))e.checked=false;
              for(const key of ['inverse','christoffel','ricci','scalar','einstein']){const e=document.querySelector(`[data-output="${key}"]`);if(e)e.checked=true;}
              document.querySelector('[data-output="einstein"]').dispatchEvent(new Event('change',{bubbles:true}));
            });
            const start=Date.now();await page.click('#calculateSelected');
            let finalState=null,last='';
            while(Date.now()-start<25000){
              const state=await page.evaluate(()=>({
                status:document.querySelector('#status')?.textContent||'',
                classes:document.querySelector('#status')?.className||'',
                progress:document.querySelector('#progressText')?.textContent||'',
                timing:document.querySelector('#calculationTime')?.textContent||'',
                result:window.__riemannianLastResult||null
              }));
              const sig=state.status+'|'+state.progress+'|'+state.timing;
              if(sig!==last){console.log('STATE',Date.now()-start,JSON.stringify(state));last=sig;}
              finalState=state;
              if(/\bis-success\b/.test(state.classes)||/\bis-error\b/.test(state.classes))break;
              await sleep(500);
            }
            const report={wallMs:Date.now()-start,finalState,events};
            console.log('DIAGNOSTIC_REPORT '+JSON.stringify(report,null,2));
            fs.writeFileSync('riemannian-diagnostic.json',JSON.stringify(report,null,2));
            await page.screenshot({path:'riemannian-diagnostic.png',fullPage:true});
            await browser.close();
            if(!finalState||!/\bis-success\b/.test(finalState.classes))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node diagnose.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riemannian-diagnostic
          path: |
            riemannian-diagnostic.json
            riemannian-diagnostic.png
