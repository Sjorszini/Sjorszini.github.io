name: Riemannian calculator smoke
on:
  push:
    branches: [finsler-calculator-experiment]
  workflow_dispatch:

jobs:
  schwarzschild-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save puppeteer-core@24
      - name: Run local server
        run: |
          python3 -m http.server 8000 > /tmp/riemannian-http.log 2>&1 &
          sleep 1
      - name: Profile Schwarzschild stages in Chrome
        run: |
          cat > /tmp/profile.cjs <<'NODE'
          const puppeteer=require(process.cwd()+'/node_modules/puppeteer-core');
          const cp=require('child_process');
          function which(c){try{return cp.execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim()}catch{return ''}}
          const executablePath=which('google-chrome')||which('chromium')||which('chromium-browser');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
            async function freshPage(){
              const page=await browser.newPage();
              page.on('pageerror',e=>console.log('PAGEERROR',e.message));
              await page.goto('http://127.0.0.1:8000/Finsler.html',{waitUntil:'networkidle2',timeout:60000});
              await page.select('#presetSelect','schwarzschild'); await page.click('#loadPreset'); return page;
            }
            async function runCase(name,keys,limit){
              const page=await freshPage();
              await page.evaluate(keys=>{for(const e of document.querySelectorAll('[data-output]'))e.checked=false;for(const k of keys){const e=document.querySelector(`[data-output="${k}"]`);if(e)e.checked=true;}},keys);
              const start=Date.now(); await page.click('#calculateSelected'); let last='';
              while(Date.now()-start<limit){
                const s=await page.evaluate(()=>({status:document.querySelector('#status')?.textContent||'',progress:document.querySelector('#progressText')?.textContent||'',timing:document.querySelector('#calculationTime')?.textContent||'',success:document.querySelector('#status')?.classList.contains('is-success'),error:document.querySelector('#status')?.classList.contains('is-error')}));
                const sig=`${s.status}|${s.progress}|${s.timing}`;if(sig!==last){console.log(name,Date.now()-start,'ms',s);last=sig;}
                if(s.success||s.error){console.log('CASE_RESULT',name,Date.now()-start,s);await page.close();return {name,ms:Date.now()-start,...s};}
                await sleep(500);
              }
              const s=await page.evaluate(()=>({status:document.querySelector('#status')?.textContent||'',progress:document.querySelector('#progressText')?.textContent||'',timing:document.querySelector('#calculationTime')?.textContent||''}));
              console.log('CASE_TIMEOUT',name,Date.now()-start,s);await page.close();return {name,timeout:true,ms:Date.now()-start,...s};
            }
            const results=[];
            results.push(await runCase('inverse',['inverse'],20000));
            results.push(await runCase('christoffel',['christoffel'],40000));
            results.push(await runCase('ricci',['ricci'],60000));
            console.log('PROFILE_SUMMARY',JSON.stringify(results,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/profile.cjs
