name: Riemannian calculator smoke
on:
  push:
    branches: [finsler-calculator-experiment]
  workflow_dispatch:

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save puppeteer-core@24
      - name: Run local server
        run: |
          python3 -m http.server 8000 > /tmp/riemannian-http.log 2>&1 &
          sleep 1
      - name: Run calculator regressions in Chrome
        run: |
          cat > smoke.cjs <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          const cp=require('child_process');
          function which(c){try{return cp.execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim()}catch{return ''}}
          const executablePath=which('google-chrome')||which('chromium')||which('chromium-browser');
          if(!executablePath)throw new Error('Chrome/Chromium not found');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const zero=v=>String(v).replace(/\s+/g,'')==='0';
          const nearly=(a,b)=>Number.isFinite(a)&&Math.abs(a-b)<1e-8;
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:1200});
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text());});
            await page.goto('http://127.0.0.1:8000/Finsler.html',{waitUntil:'networkidle2',timeout:60000});

            async function calculate(preset,keys){
              await page.select('#presetSelect',preset);await page.click('#loadPreset');
              await page.evaluate(keys=>{
                for(const e of document.querySelectorAll('[data-output]'))e.checked=false;
                for(const key of keys){const e=document.querySelector(`[data-output="${key}"]`);if(e)e.checked=true;}
                const trigger=document.querySelector(`[data-output="${keys[keys.length-1]}"]`);if(trigger)trigger.dispatchEvent(new Event('change',{bubbles:true}));
              },keys);
              const start=Date.now();await page.click('#calculateSelected');
              await page.waitForFunction(()=>document.querySelector('#status')?.classList.contains('is-success')||document.querySelector('#status')?.classList.contains('is-error'),{timeout:30000});
              const status=await page.$eval('#status',e=>({text:e.textContent,cls:e.className}));
              if(!/\bis-success\b/.test(status.cls))throw new Error(preset+' failed: '+status.text);
              await page.waitForFunction(()=>window.__riemannianLastResult!==null,{timeout:3000});
              await sleep(700);
              return {ms:Date.now()-start,result:await page.evaluate(()=>window.__riemannianLastResult)};
            }

            function allZero(matrix){return Array.isArray(matrix)&&matrix.every(row=>row.every(zero));}
            function evalExpr(expr,scope){return page.evaluate(({expr,scope})=>math.evaluate(expr,scope),{expr,scope});}
            function component(list,i,j,k){return (list||[]).find(c=>c.i===i&&c.j===j&&c.k===k);}
            async function cardSnapshot(){
              return page.evaluate(()=>{
                const cards=[...document.querySelectorAll('#results .result-card')];
                const get=title=>cards.find(c=>c.querySelector('summary strong')?.textContent.trim()===title);
                function snap(title){const c=get(title);return c?{text:c.textContent||'',html:c.innerHTML,copy:[...c.querySelectorAll('.copy-button')].map(b=>b.dataset.copy||''),rows:c.querySelectorAll('.component-row').length,matrix:!!c.querySelector('.matrix-display,.result-matrix,.matrix-output,table')}:null;}
                return {ricci:snap('Ricci tensor'),scalar:snap('Ricci scalar'),einstein:snap('Einstein tensor'),inverse:snap('Inverse metric and determinant'),christoffel:snap('Levi-Civita connection'),mjxErrors:[...document.querySelectorAll('mjx-merror')].map(e=>e.textContent||'MathJax error')};
              });
            }

            const report={};
            report.schwarzschild=await calculate('schwarzschild',['inverse','christoffel','ricci','scalar','einstein']);
            report.schwarzschild.cards=await cardSnapshot();
            if(!allZero(report.schwarzschild.result.ricci))throw new Error('Schwarzschild Ricci is not zero');
            if(!zero(report.schwarzschild.result.scalar))throw new Error('Schwarzschild scalar is not zero');
            if(!allZero(report.schwarzschild.result.einstein))throw new Error('Schwarzschild Einstein is not zero');
            if(!report.schwarzschild.cards.ricci?.text.includes('All components simplify to zero.'))throw new Error('Ricci zero-component presentation missing');
            if(!report.schwarzschild.cards.einstein?.text.includes('All components simplify to zero.'))throw new Error('Einstein zero-component presentation missing');
            if(report.schwarzschild.cards.ricci?.matrix||report.schwarzschild.cards.einstein?.matrix)throw new Error('Ricci/Einstein still shown as matrices');
            if(report.schwarzschild.cards.mjxErrors.length)throw new Error('Schwarzschild MathJax errors: '+report.schwarzschild.cards.mjxErrors.join('|'));

            report.flrw=await calculate('flrw-flat',['ricci','scalar','einstein']);
            report.flrw.cards=await cardSnapshot();
            const f=report.flrw.result,scope={__uf0:2,__uf0_d1:3,__uf0_d1_1:5,x1:11,x2:7,x3:0.8,x4:0.4};
            report.flrw.numeric={
              Rtt:await evalExpr(f.ricci[0][0],scope),
              Rrr:await evalExpr(f.ricci[1][1],scope),
              scalar:await evalExpr(f.scalar,scope),
              Gtt:await evalExpr(f.einstein[0][0],scope),
              Grr:await evalExpr(f.einstein[1][1],scope)
            };
            if(!nearly(report.flrw.numeric.Rtt,-7.5))throw new Error('FLRW R_tt mismatch '+report.flrw.numeric.Rtt);
            if(!nearly(report.flrw.numeric.Rrr,28))throw new Error('FLRW R_rr mismatch '+report.flrw.numeric.Rrr);
            if(!nearly(report.flrw.numeric.scalar,28.5))throw new Error('FLRW scalar mismatch '+report.flrw.numeric.scalar);
            if(!nearly(report.flrw.numeric.Gtt,6.75))throw new Error('FLRW G_tt mismatch '+report.flrw.numeric.Gtt);
            if(!nearly(report.flrw.numeric.Grr,-29))throw new Error('FLRW G_rr mismatch '+report.flrw.numeric.Grr);
            if(report.flrw.cards.ricci?.matrix||report.flrw.cards.einstein?.matrix)throw new Error('FLRW Ricci/Einstein still shown as matrices');
            if(!report.flrw.cards.ricci?.rows||!report.flrw.cards.einstein?.rows)throw new Error('FLRW component rows missing');
            const copied=(report.flrw.cards.ricci.copy.join('\n')+'\n'+report.flrw.cards.einstein.copy.join('\n'));
            if(!/\\dot\{|\\ddot\{/.test(copied))throw new Error('FLRW derivative dot notation missing: '+copied);
            if(/a_\{?t\}?/.test(copied))throw new Error('Old a_t notation remains: '+copied);
            if(report.flrw.cards.mjxErrors.length)throw new Error('FLRW MathJax errors: '+report.flrw.cards.mjxErrors.join('|'));

            report.minkowski=await calculate('minkowski',['christoffel','ricci','scalar','einstein']);
            report.minkowski.cards=await cardSnapshot();
            if(report.minkowski.result.christoffel.length)throw new Error('Minkowski Christoffels are not zero');
            if(!allZero(report.minkowski.result.ricci)||!zero(report.minkowski.result.scalar)||!allZero(report.minkowski.result.einstein))throw new Error('Minkowski curvature is not zero');
            if(report.minkowski.cards.mjxErrors.length)throw new Error('Minkowski MathJax errors');

            report.polar=await calculate('polar2',['christoffel','ricci','scalar']);
            report.polar.cards=await cardSnapshot();
            if(!allZero(report.polar.result.ricci)||!zero(report.polar.result.scalar))throw new Error('Polar plane curvature is not zero');
            const pr=component(report.polar.result.christoffel,0,1,1),pp=component(report.polar.result.christoffel,1,0,1);
            if(!pr||!pp)throw new Error('Polar Christoffel components missing');
            report.polar.numeric={GammaRphiphi:await evalExpr(pr.value,{x1:3,x2:0.4}),GammaPhirphi:await evalExpr(pp.value,{x1:3,x2:0.4})};
            if(!nearly(report.polar.numeric.GammaRphiphi,-3)||!nearly(report.polar.numeric.GammaPhirphi,1/3))throw new Error('Polar Christoffel mismatch '+JSON.stringify(report.polar.numeric));
            if(report.polar.cards.mjxErrors.length)throw new Error('Polar MathJax errors');

            report.sphere=await calculate('sphere2',['ricci','scalar','einstein']);
            report.sphere.cards=await cardSnapshot();
            const s=report.sphere.result,sphereScope={R:3,x1:0.7,x2:0.2};
            report.sphere.numeric={Rthetatheta:await evalExpr(s.ricci[0][0],sphereScope),Rphiphi:await evalExpr(s.ricci[1][1],sphereScope),scalar:await evalExpr(s.scalar,sphereScope)};
            if(!nearly(report.sphere.numeric.Rthetatheta,1))throw new Error('Sphere R_theta_theta mismatch '+report.sphere.numeric.Rthetatheta);
            if(!nearly(report.sphere.numeric.Rphiphi,Math.sin(0.7)**2))throw new Error('Sphere R_phi_phi mismatch '+report.sphere.numeric.Rphiphi);
            if(!nearly(report.sphere.numeric.scalar,2/9))throw new Error('Sphere scalar mismatch '+report.sphere.numeric.scalar);
            if(!allZero(s.einstein))throw new Error('2-sphere Einstein tensor should vanish identically');
            if(report.sphere.cards.mjxErrors.length)throw new Error('Sphere MathJax errors');

            report.errors=errors;
            if(errors.length)throw new Error(errors.join(' | '));
            console.log('REGRESSION_REPORT '+JSON.stringify(report,null,2));
            fs.writeFileSync('riemannian-regression.json',JSON.stringify(report,null,2));
            await page.screenshot({path:'riemannian-regression.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riemannian-regression
          path: |
            riemannian-regression.json
            riemannian-regression.png
