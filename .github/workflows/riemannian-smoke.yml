name: Riemannian calculator smoke

on:
  push:
    branches: [finsler-calculator-experiment]

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save puppeteer-core@24
      - run: |
          python3 -m http.server 8000 > /tmp/riemannian-http.log 2>&1 &
          sleep 1
      - name: Browser regression
        run: |
          cat > smoke.cjs <<'NODE'
          const puppeteer=require('puppeteer-core'),cp=require('child_process');
          const which=c=>{try{return cp.execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim()}catch{return ''}};
          const executablePath=which('google-chrome')||which('chromium')||which('chromium-browser');
          const zero=v=>String(v).replace(/\s+/g,'')==='0', nearly=(a,b)=>Number.isFinite(a)&&Math.abs(a-b)<1e-8, sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage(),errors=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text());});
            await page.goto('http://127.0.0.1:8000/Finsler.html',{waitUntil:'networkidle2',timeout:60000});
            const scripts=await page.$$eval('script[src]',es=>es.map(e=>e.getAttribute('src')));
            if(scripts.some(s=>/riemannian-(performance|output)\.js/.test(s)))throw new Error('obsolete wrapper still loaded '+scripts.join(','));
            if(!(await page.$eval('#calculationTime',e=>e.hidden)))throw new Error('idle timing badge is visible');
            async function calc(preset,keys,checkLive){
              await page.select('#presetSelect',preset);await page.click('#loadPreset');
              await page.evaluate(keys=>{for(const e of document.querySelectorAll('[data-output]'))e.checked=false;for(const k of keys){const e=document.querySelector(`[data-output="${k}"]`);if(e)e.checked=true;}},keys);
              await page.click('#calculateSelected');
              if(checkLive){await page.waitForFunction(()=>/elapsed/.test(document.querySelector('#calculationTime')?.textContent||''),{timeout:5000});}
              await page.waitForFunction(()=>document.querySelector('#status')?.classList.contains('is-success')||document.querySelector('#status')?.classList.contains('is-error'),{timeout:30000});
              const status=await page.$eval('#status',e=>({text:e.textContent,cls:e.className}));if(!status.cls.includes('is-success'))throw new Error(preset+': '+status.text);
              await page.waitForFunction(()=>window.__riemannianLastResult!==null,{timeout:3000});await sleep(350);
              const timing=await page.$eval('#calculationTime',e=>({hidden:e.hidden,text:e.textContent}));if(timing.hidden||/elapsed/.test(timing.text)||!/(ms|s)$/.test(timing.text))throw new Error('bad final timing '+JSON.stringify(timing));
              return page.evaluate(()=>window.__riemannianLastResult);
            }
            const allZero=m=>m.every(row=>row.every(zero)), ev=(expr,scope)=>page.evaluate(({expr,scope})=>math.evaluate(expr,scope),{expr,scope});
            const s=await calc('schwarzschild',['inverse','christoffel','ricci','scalar','einstein'],true);
            if(!allZero(s.ricci)||!zero(s.scalar)||!allZero(s.einstein))throw new Error('Schwarzschild curvature regression');
            const vacuumText=await page.$$eval('#results .result-card',cards=>cards.filter(c=>/Ricci tensor|Einstein tensor/.test(c.querySelector('summary strong')?.textContent||'')).map(c=>c.querySelector('.result-card-body')?.textContent||''));
            if(vacuumText.length!==2||vacuumText.some(t=>!t.includes('All components simplify to zero.')))throw new Error('vacuum tensor UI regression '+JSON.stringify(vacuumText));
            const f=await calc('flrw-flat',['ricci','scalar','einstein']);
            const fs={__uf0:2,__uf0_d1:3,__uf0_d1_1:5,x1:11,x2:7,x3:.8,x4:.4};
            if(!nearly(await ev(f.ricci[0][0],fs),-7.5)||!nearly(await ev(f.scalar,fs),28.5)||!nearly(await ev(f.einstein[0][0],fs),6.75))throw new Error('FLRW regression');
            const componentCounts=await page.$$eval('#results .result-card',cards=>Object.fromEntries(cards.map(c=>[c.querySelector('summary strong')?.textContent||'',c.querySelectorAll('.component-row').length])));
            if(componentCounts['Ricci tensor']!==4||componentCounts['Einstein tensor']!==4)throw new Error('tensor component rendering regression '+JSON.stringify(componentCounts));
            const m=await calc('minkowski',['christoffel','ricci','scalar','einstein']);if(m.christoffel.length||!allZero(m.ricci)||!zero(m.scalar)||!allZero(m.einstein))throw new Error('Minkowski regression');
            const p=await calc('polar2',['christoffel','ricci','scalar']);if(!allZero(p.ricci)||!zero(p.scalar))throw new Error('Polar regression');
            const q=await calc('sphere2',['ricci','scalar','einstein']),qs={R:3,x1:.7,x2:.2};if(!nearly(await ev(q.scalar,qs),2/9)||!allZero(q.einstein))throw new Error('Sphere regression');
            const mjx=await page.$$eval('mjx-merror',es=>es.map(e=>e.textContent));if(mjx.length||errors.length)throw new Error('Browser errors '+JSON.stringify({mjx,errors}));
            console.log('INTEGRATED_CONTROLLER_PASS');await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node smoke.cjs
