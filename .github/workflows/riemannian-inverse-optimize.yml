name: Apply block inverse optimization

on:
  push:
    branches: [finsler-calculator-experiment]
    paths:
      - .github/workflows/riemannian-inverse-optimize.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finsler-calculator-experiment
      - name: Apply optimization
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'Generic disconnected-block inverse fast path' riemannian-worker.js; then
            printf '%s' '' | base64 -d >> riemannian-worker.js
          fi
          sed -i 's/riemannian-worker.js?v=3/riemannian-worker.js?v=4/' riemannian-calculator.js
          sed -i 's/riemannian-calculator.js?v=4/riemannian-calculator.js?v=5/' Finsler.html
          sed -i 's/riemannian-extra-presets.js?v=1/riemannian-extra-presets.js?v=2/' Finsler.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add riemannian-worker.js riemannian-calculator.js Finsler.html
          git commit -m 'Optimize disconnected metric-block inversion'
          git push origin HEAD:finsler-calculator-experiment
