name: Apply prettier mathematical notation

on:
  push:
    branches: [finsler-calculator-experiment]
    paths:
      - '.github/workflows/pretty-math-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: finsler-calculator-experiment
          fetch-depth: 0
      - name: Fix result TeX formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('finsler-ui-v6.js')
          s = p.read_text()
          start = s.index('function prettyResultTex(text)')
          end = s.index('function tex(expr)', start)
          new = r'''function prettyResultTex(text){
  var s=String(text);
  s=s.replace(/\\mathrm\{rs\}/g,"r_{s}").replace(/\\operatorname\{rs\}/g,"r_{s}");
  s=s.replace(/(^|[^A-Za-z])rs(?=$|[^A-Za-z])/g,function(all,prefix){return prefix+"r_{s}";});
  var fn="\\\\(?:sin|cos|tan|sinh|cosh|tanh)";
  var arg="(?:\\\\[A-Za-z]+|[A-Za-z](?:_\\{[A-Za-z0-9]+\\})?)";
  s=s.replace(new RegExp("\\{("+fn+")\\\\left\\(\\s*("+arg+")\\s*\\\\right\\)\\}\\s*\\^\\s*\\{([^{}]+)\\}","g"),"$1^{$3} $2");
  s=s.replace(new RegExp("("+fn+")\\s*\\^\\s*\\{([^{}]+)\\}\\s*\\\\left\\(\\s*("+arg+")\\s*\\\\right\\)","g"),"$1^{$2} $3");
  s=s.replace(new RegExp("("+fn+")\\\\left\\(\\s*("+arg+")\\s*\\\\right\\)\\s*\\^\\s*\\{([^{}]+)\\}","g"),"$1^{$3} $2");
  s=s.replace(new RegExp("("+fn+")\\\\left\\(\\s*("+arg+")\\s*\\\\right\\)","g"),"$1 $2");
  return s;
}
'''
          p.write_text(s[:start] + new + s[end:])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add finsler-ui-v6.js
          git commit -m 'Fix compact trigonometric notation'
          git push origin HEAD:finsler-calculator-experiment
