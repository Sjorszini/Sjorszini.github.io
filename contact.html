<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Sjors Heefer about academic work, teaching, research or piano enquiries.">
  <title>Contact - Sjors Heefer</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="stylesheet" type="text/css" href="contact.css?v=4">
  <link rel="stylesheet" type="text/css" href="menu-clean.css?v=3">
  <link rel="icon" href="icon.ico" type="image/vnd.microsoft.icon">
  <script src="contact.js?v=4" defer></script>
</head>
<body class="contact-page">

<div class="container">
  <header>
    <EinsteinQuote><i>"The most beautiful thing we can experience is the mysterious.<br> It is the source of all true art and science."</i> — A. Einstein</EinsteinQuote>
    <h1>Sjors Heefer</h1>
  </header>

  <article>
    <h1>Contact</h1>

    <form class="contact-form" id="contact-form" method="post" novalidate>
      <div class="contact-field">
        <label for="contact-topic">Topic</label>
        <select id="contact-topic" name="topic" required>
          <option value="academic">Academic / research</option>
          <option value="teaching">Teaching</option>
          <option value="music">Piano</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="contact-field">
        <label for="contact-name">Your name</label>
        <input id="contact-name" name="name" type="text" autocomplete="name" required>
      </div>

      <div class="contact-field">
        <label for="contact-email">Your email address</label>
        <input id="contact-email" name="email" type="email" autocomplete="email" required>
      </div>

      <div class="contact-field">
        <label for="contact-subject">Subject <span class="contact-note">(optional)</span></label>
        <input id="contact-subject" name="subject" type="text" autocomplete="off">
      </div>

      <div class="contact-field">
        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" required></textarea>
      </div>

      <div class="contact-honeypot" aria-hidden="true">
        <label for="contact-honey">Leave this field empty</label>
        <input id="contact-honey" name="_honey" type="text" tabindex="-1" autocomplete="off">
      </div>

      <div class="contact-actions">
        <button class="contact-submit" id="contact-submit" type="submit">Send message</button>
      </div>

      <p class="contact-note">Messages are processed by FormSubmit for delivery and spam filtering.</p>
      <p class="contact-status" id="contact-status" role="status" aria-live="polite"></p>
    </form>
  </article>

  <footer class="site-footer"><span>&copy; 2017–2026 Sjors Heefer</span></footer>
</div>

<menubar>
  <button class="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" onclick="var o=this.parentElement.classList.toggle('menu-open');this.setAttribute('aria-expanded',o?'true':'false');"><span>Menu</span><span class="mobile-menu-icon" aria-hidden="true"></span></button>

    <menu-item><a href="Balls.html">Balls</a></menu-item>
    <menu-item><a href="Finsler.html">Calc</a></menu-item>
    <menu-item class="currentpage"><a href="contact.html">Contact</a></menu-item>
  </menu>
</menubar>

</body>
</html>
