<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finsler output simplification regression</title>
<style>
body{max-width:960px;margin:30px auto;padding:0 18px;font:15px/1.5 system-ui,sans-serif;color:#10243d}button{padding:9px 13px}.case{margin:12px 0;padding:12px;border:1px solid #d7e1ea;border-radius:9px}.pass{color:#236342}.fail{color:#8b313b}pre{white-space:pre-wrap;overflow:auto}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/mathjs@11.11.2/lib/browser/math.js"></script>
</head>
<body>
<h1>Final-output simplification regression</h1>
<p>This developer test checks the actual worker output boundary. Every emitted symbolic component must already be at least as compact as the result of math.js <code>simplify()</code> or <code>rationalize()</code>.</p>
<button id="run">Run</button> <strong id="summary">Not run</strong>
<div id="cases"></div>
<script>
(function(){
"use strict";
var run=document.getElementById("run"),host=document.getElementById("cases"),summary=document.getElementById("summary");
function compact(s){return String(s).replace(/\s+/g,"");}
function equivalent(a,b){try{return typeof math.symbolicEqual==="function"?math.symbolicEqual(a,b):true;}catch(e){return true;}}
function shorterBuiltIn(value){
  var original=String(value),best=original,candidates=[];
  try{candidates.push({name:"simplify",value:math.simplify(original).toString({parenthesis:"auto"})});}catch(e){}
  try{candidates.push({name:"rationalize",value:math.rationalize(original).toString({parenthesis:"auto"})});}catch(e){}
  candidates.forEach(function(c){if(equivalent(original,c.value)&&compact(c.value).length<compact(best).length)best=c.value;});
  return best===original?null:best;
}
function workerRun(payload,timeout){
 return new Promise(function(resolve,reject){
  var w=new Worker("finsler-worker-v4.js?v=6"),messages=[],done=false;
  var timer=setTimeout(function(){if(done)return;done=true;w.terminate();reject(new Error("timeout"));},timeout||30000);
  w.onmessage=function(e){var m=e.data||{};messages.push(m);if(m.type==="error"&&!done){done=true;clearTimeout(timer);w.terminate();reject(new Error(m.message||"worker error"));}if(m.type==="done"&&!done){done=true;clearTimeout(timer);w.terminate();resolve(messages);}};
  w.onerror=function(e){if(done)return;done=true;clearTimeout(timer);w.terminate();reject(new Error(e.message||"worker exception"));};
  w.postMessage(Object.assign({type:"calculate",symbolicFunctions:[]},payload));
 });
}
function audit(messages){
 var issues=[],counts={};
 messages.forEach(function(m){
  if(m.type!=="component"||typeof m.value!=="string")return;
  counts[m.section]=(counts[m.section]||0)+1;
  var shorter=shorterBuiltIn(m.value);
  if(shorter)issues.push(m.section+" · "+m.label+"\n  got: "+m.value+"\n  built-in shorter: "+shorter);
 });
 return {issues:issues,counts:counts};
}
var tests=[
 {name:"Polar-plane metric — all output families",payload:{n:2,inputType:"metric",metricEntries:[["1","0"],["0","x1^2"]],alphaBeta:{enabled:false},outputs:{inverse:true,spray:true,nonlinear:true,connections:true,curvature:true,deviation:true,ricci:true,affine:true}}},
 {name:"Schwarzschild — inverse and curvature families",payload:{n:4,inputType:"metric",metricEntries:[["-(1-rs/x2)","0","0","0"],["0","1/(1-rs/x2)","0","0"],["0","0","x2^2","0"],["0","0","0","x2^2*sin(x3)^2"]],alphaBeta:{enabled:false},outputs:{inverse:true,connections:true,ricci:true,affine:true}}}
];
async function runTests(){
 run.disabled=true;host.innerHTML="";summary.textContent="Running…";var failures=0,total=0;
 for(var i=0;i<tests.length;i++){
  var box=document.createElement("section");box.className="case";box.innerHTML="<h2>"+tests[i].name+"</h2><pre>Running…</pre>";host.appendChild(box);
  try{
   var result=audit(await workerRun(tests[i].payload,45000));total++;
   var ok=result.issues.length===0;if(!ok)failures++;
   box.classList.add(ok?"pass":"fail");box.querySelector("pre").textContent=(ok?"PASS\n":"FAIL\n")+"sections: "+JSON.stringify(result.counts)+(result.issues.length?"\n\n"+result.issues.join("\n\n"):"");
  }catch(e){failures++;total++;box.classList.add("fail");box.querySelector("pre").textContent="FAIL\n"+(e.message||String(e));}
 }
 summary.textContent=failures?failures+" failed / "+total:total+" passed";summary.className=failures?"fail":"pass";document.title=(failures?"FAIL":"PASS")+" · output simplification regression";run.disabled=false;
}
run.addEventListener("click",runTests);window.addEventListener("load",function(){setTimeout(runTests,100);});
})();
</script>
</body>
</html>
